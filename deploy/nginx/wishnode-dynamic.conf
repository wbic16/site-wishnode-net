# wishnode.net — dynamic paths for the wishnode backend.
#
# ACTIVATION (one root action, once): add this line inside the
# wishnode.net 443 server block in /etc/nginx/sites-available/wishnode.net
#
#     include /sites/web/wishnode.net/nginx/wishnode-dynamic.conf;
#
# then `nginx -t` and reload. This file itself lives in a
# wbic16-writable path, so future route changes need no root.
#
# Only the backend's own routes are proxied. SQ is never proxied:
# its single key authorizes writes as well as reads.

location /api/ {
    proxy_pass http://127.0.0.1:8940;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    client_max_body_size 32k;
}

location /auth/ {
    proxy_pass http://127.0.0.1:8940;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    client_max_body_size 32k;
}

location = /status {
    proxy_pass http://127.0.0.1:8940;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
}

location = /my {
    proxy_pass http://127.0.0.1:8940;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
}
