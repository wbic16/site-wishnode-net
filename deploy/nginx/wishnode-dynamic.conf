# wishnode.net — dynamic paths for the wishnode backend and the five
# Exocortexia demo applications.
#
# ACTIVATION (one root action, once): add this line inside the
# wishnode.net 443 server block in /etc/nginx/sites-available/wishnode.net
#
#     include /sites/web/wishnode.net/nginx/wishnode-dynamic.conf;
#
# then `nginx -t` and reload. This file itself lives in a
# wbic16-writable path, so future route changes need no root.
#
# Only the backend's own routes and the demo apps are proxied. SQ is
# never proxied: its single key authorizes writes as well as reads.
#
# The five apps are the real Exocortexia programs (wbic16/Exocortexia
# @ 342a268), running on this host in explicit open demo mode
# (EXO_DEMO_MODE=1, banner shown in-app) with made-up data, as systemd
# user units exo-<app>.service, bound to 127.0.0.1 only:
#
#     /apps/records-desk/       -> 127.0.0.1:8801
#     /apps/minutes-publisher/  -> 127.0.0.1:8802
#     /apps/contract-ledger/    -> 127.0.0.1:8803
#     /apps/data-catalog/       -> 127.0.0.1:8804
#     /apps/forms-router/       -> 127.0.0.1:8805
#
# The apps emit root-absolute links (href="/...", form action="/...")
# and know nothing of the subpath. proxy_pass with a trailing slash
# strips the /apps/<app>/ prefix on the way in, and sub_filter rewrites
# the two absolute-URL attribute forms on the way out (the box's nginx
# is built --with-http_sub_module). The apps build no URLs in
# JavaScript and emit no other absolute references, so these two
# rewrites are the complete set. sub_filter applies to text/html only
# (its default), so JSON API responses pass through byte-exact.

location /api/ {
    proxy_pass http://127.0.0.1:8940;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    client_max_body_size 32k;
}

location /auth/ {
    proxy_pass http://127.0.0.1:8940;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    client_max_body_size 32k;
}

location = /status {
    proxy_pass http://127.0.0.1:8940;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
}

location = /my {
    proxy_pass http://127.0.0.1:8940;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
}

# ------------------------------------------------------------------
# The five Exocortexia demo applications
# ------------------------------------------------------------------

location = /apps/records-desk {
    return 301 /apps/records-desk/;
}

location /apps/records-desk/ {
    proxy_pass http://127.0.0.1:8801/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Accept-Encoding "";
    proxy_redirect / /apps/records-desk/;
    client_max_body_size 1m;
    sub_filter_once off;
    sub_filter 'href="/' 'href="/apps/records-desk/';
    sub_filter 'action="/' 'action="/apps/records-desk/';
}

location = /apps/minutes-publisher {
    return 301 /apps/minutes-publisher/;
}

location /apps/minutes-publisher/ {
    proxy_pass http://127.0.0.1:8802/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Accept-Encoding "";
    proxy_redirect / /apps/minutes-publisher/;
    client_max_body_size 1m;
    sub_filter_once off;
    sub_filter 'href="/' 'href="/apps/minutes-publisher/';
    sub_filter 'action="/' 'action="/apps/minutes-publisher/';
}

location = /apps/contract-ledger {
    return 301 /apps/contract-ledger/;
}

location /apps/contract-ledger/ {
    proxy_pass http://127.0.0.1:8803/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Accept-Encoding "";
    proxy_redirect / /apps/contract-ledger/;
    client_max_body_size 1m;
    sub_filter_once off;
    sub_filter 'href="/' 'href="/apps/contract-ledger/';
    sub_filter 'action="/' 'action="/apps/contract-ledger/';
}

location = /apps/data-catalog {
    return 301 /apps/data-catalog/;
}

location /apps/data-catalog/ {
    proxy_pass http://127.0.0.1:8804/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Accept-Encoding "";
    proxy_redirect / /apps/data-catalog/;
    client_max_body_size 1m;
    proxy_read_timeout 120s;
    sub_filter_once off;
    sub_filter 'href="/' 'href="/apps/data-catalog/';
    sub_filter 'action="/' 'action="/apps/data-catalog/';
}

location = /apps/forms-router {
    return 301 /apps/forms-router/;
}

location /apps/forms-router/ {
    proxy_pass http://127.0.0.1:8805/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Accept-Encoding "";
    proxy_redirect / /apps/forms-router/;
    client_max_body_size 1m;
    sub_filter_once off;
    sub_filter 'href="/' 'href="/apps/forms-router/';
    sub_filter 'action="/' 'action="/apps/forms-router/';
}
